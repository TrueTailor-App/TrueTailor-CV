name: Keep Supabase Project Alive

on:
  schedule:
    # מריץ את הפעולה מדי 3 ימים בשעה 12:30 UTC
    - cron: '30 12 */3 * *'
  workflow_dispatch: # מאפשר הרצה ידנית בלחיצת כפתור

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://fruzzkgdjaludyxbsymi.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Supabase response status code: $response"
          
          if [ "$response" -ne 200 ]; then
            echo "Failed to ping Supabase, expected status 200 but got $response"
            exit 1
          fi